name: Feature request
description: Suggest an idea or improvement for PipeCraft
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement!

        Please check the existing issues and [Discussions](https://github.com/lemonlimeacid/PipeCraft/discussions) first — your idea may already be there.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the limitation or pain point you are hitting.
      placeholder: I often need to ... but PipeCraft currently ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like PipeCraft to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you have tried.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of PipeCraft does this concern?
      options:
        - Visual editor / canvas
        - YAML generation or import
        - Validation / security checks
        - Runner cost estimate
        - AI assistant
        - Templates and projects
        - Desktop packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples from other tools, links — anything that helps explain the idea.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and discussions and this is not a duplicate.
          required: true
