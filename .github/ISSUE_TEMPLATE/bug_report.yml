name: Bug report
description: Report something that is not working in PipeCraft
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!

        Please search the existing issues first — and if this is a question rather than a bug, use [Discussions](https://github.com/lemonlimeacid/PipeCraft/discussions) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I drag a step node onto a job, ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Open the editor
        2. Add a job and a step
        3. Connect them
        4. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Where does it happen?
      options:
        - Windows (.exe)
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Linux (AppImage)
        - Linux (Flatpak)
        - Web / self-hosted
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PipeCraft version
      description: Shown in the window title or in the release you downloaded.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, YAML or screenshots
      description: Paste the workflow YAML, console output or screenshots that help explain the problem.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I am using the latest release of PipeCraft.
          required: false
